services:
  web:
    build: .
    command: uvicorn dqwatch.web.app:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: [{path: .env, required: false}]
    volumes: [data:/data]
  dagster:
    build: .
    command: sh -c "mkdir -p $$DAGSTER_HOME /data/inbox && cp dagster.yaml $$DAGSTER_HOME/ && dagster dev -m dqwatch.orchestration -h 0.0.0.0 -p 3000"
    ports: ["3000:3000"]
    env_file: [{path: .env, required: false}]
    volumes: [data:/data]
  ollama:
    image: ollama/ollama
    volumes: [ollama:/root/.ollama]
volumes:
  data:
  ollama:
